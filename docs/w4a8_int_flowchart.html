<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>W4A8-int 计算流程图</title>
<style>body{font-family:"PingFang SC",sans-serif;background:#f6f7f9;margin:0;padding:20px}svg{background:#fff;border:1px solid #dde;border-radius:10px}</style>
</head><body>
<svg width="1180" height="1560" viewBox="0 0 1180 1560" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#64748b"/></marker>
<style>
.b{rx:9;stroke-width:1.4}.t{font-size:13px;fill:#1e293b}.s{font-size:11px;fill:#475569}.h{font-size:15px;font-weight:700;fill:#0f172a}
.int{fill:#e6fffa;stroke:#2c9e8f}.flt{fill:#fff1f0;stroke:#e07a72}.mem{fill:#fefce8;stroke:#ca9a04}.hw{fill:#eff6ff;stroke:#5b8def}.pl{fill:#f1f5f9;stroke:#94a3b8}
.e{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}
</style>
</defs>

<text x="30" y="34" class="h" font-size="19">W4A8-int（QServe两级量化+零点）专家层计算流程 — H20（v3）</text>
<text x="30" y="56" class="s">绿=整数域(bit精确)　红=浮点域　黄=存储搬运　蓝=硬件单元</text>

<!-- 离线量化 -->
<rect x="30" y="75" width="1120" height="120" class="b pl"/>
<text x="45" y="97" class="h">离线：权重两级量化（每层一次，存盘）</text>
<rect x="45" y="110" width="180" height="66" class="b flt"/><text x="55" y="132" class="t">原始权重 bf16</text><text x="55" y="150" class="s">每输出行求amax</text><text x="55" y="166" class="s">→ 行缩放 s1 (bf16)</text>
<line x1="225" y1="143" x2="265" y2="143" class="e"/>
<rect x="265" y="110" width="200" height="66" class="b int"/><text x="275" y="132" class="t">÷s1 → 8位整数(±112)</text><text x="275" y="150" class="s">每128个K一组: 组缩放s2(整数)</text><text x="275" y="166" class="s">+ 零点z → 4位无符号权重</text>
<line x1="465" y1="143" x2="505" y2="143" class="e"/>
<rect x="505" y="110" width="290" height="66" class="b mem"/><text x="515" y="132" class="t">落盘：4位打包权重（长驻显存）</text><text x="515" y="150" class="s">元数据字/行/128K: [s2:1字节|z:1字节|s1:bf16]</text><text x="515" y="166" class="s">重建保证 (w4−z)×s2 ≤ ±127</text>
<line x1="795" y1="143" x2="835" y2="143" class="e"/>
<rect x="835" y="110" width="295" height="66" class="b mem"/><text x="845" y="132" class="t">激活（每次前向，动态）</text><text x="845" y="150" class="s">每token求amax÷127 → token缩放</text><text x="845" y="166" class="s">量化8位整数，随路由分发到各卡</text>

<!-- 分支判断 -->
<line x1="590" y1="195" x2="590" y2="230" class="e"/>
<rect x="465" y="230" width="250" height="44" class="b pl"/><text x="490" y="250" class="t">token 数 ≤ 1024 ？</text><text x="490" y="266" class="s">（唯一的运行时分界开关）</text>
<line x1="465" y1="252" x2="280" y2="252" class="e"/><text x="330" y="245" class="s">是 → swapAB 路径</text>
<line x1="715" y1="252" x2="900" y2="252" class="e"/><text x="750" y="245" class="s">否 → 预解码路径</text>

<!-- 左列：swapAB -->
<text x="60" y="305" class="h">A. token≤1024：预存表解码（v3）+ 小M双CTA档</text>
<rect x="60" y="320" width="440" height="58" class="b hw"/><text x="70" y="341" class="t">TMA 搬运引擎（6级流水，边算边搬）</text><text x="70" y="359" class="s">4位打包权重 + 元数据字 + 激活8位字节 → 共享内存</text>
<line x1="280" y1="378" x2="280" y2="404" class="e"/>
<rect x="60" y="404" width="440" height="74" class="b int"/><text x="70" y="425" class="t">取预存解码表（v3：编译期算好，启动搬一次）</text><text x="70" y="443" class="s">表项={(0−z)×s2,…,(7−z)×s2}；(s2,z)组合仅18×16=288种→全部预存(2.3KB)</text><text x="70" y="460" class="s">按本组(s2,z)取8字节一行，建表指令归零（flash M1 −23%）；对称格式仍现场建（2条乘法）</text>
<line x1="280" y1="478" x2="280" y2="504" class="e"/>
<rect x="60" y="504" width="440" height="74" class="b int"/><text x="70" y="525" class="t">查表解码（藏在上一批矩阵乘的异步空窗里）</text><text x="70" y="543" class="s">低3位作索引，byte_perm 一条查4个权重 → 直接得 (w4−z)×s2 的8位整数</text><text x="70" y="560" class="s">高半区按字节加 8×s2；产物留寄存器，即用即弃</text>
<line x1="280" y1="578" x2="280" y2="604" class="e"/>
<rect x="60" y="604" width="440" height="74" class="b hw"/><text x="70" y="625" class="t">tensor core：WGMMA m64×n×k32（k永远=32）</text><text x="70" y="643" class="s">swapAB：权重当A(寄存器喂)、token当B——token少时也填满64行格子</text><text x="70" y="660" class="s">4条指令首尾相接累进同一个32位整数累加器（尺子已统一，合法）</text>
<line x1="280" y1="678" x2="280" y2="704" class="e"/>
<rect x="60" y="704" width="440" height="66" class="b flt"/><text x="70" y="725" class="t">promote（每128个K补一次缩放）</text><text x="70" y="743" class="s">整数累加器→浮点，×token缩放×s1，累进最终浮点累加器</text><text x="70" y="760" class="s">实测不在关键路径（被同SM邻居的工作自然盖住），无需买重叠</text>
<line x1="280" y1="770" x2="280" y2="796" class="e"/><text x="290" y="790" class="s">K方向循环 32~56 段后 ↓</text>

<!-- 右列：PRE -->
<text x="690" y="305" class="h">B. token≥1280：预解码（PRE）</text>
<rect x="690" y="320" width="440" height="74" class="b int"/><text x="700" y="341" class="t">前置kernel（每层一次，~0.5ms固定，与token数无关）</text><text x="700" y="359" class="s">逐元素 (w4−z)×s2 朴素乘法 → 8位整数权重写临时缓冲</text><text x="700" y="376" class="s">带宽瓶颈型kernel，算术单元免费</text>
<line x1="910" y1="394" x2="910" y2="420" class="e"/>
<rect x="690" y="420" width="440" height="58" class="b mem"/><text x="700" y="441" class="t">主kernel TMA 直搬8位权重行（128字节/行）进共享内存</text><text x="700" y="459" class="s">解码、查表、同步栅栏整段消失；大tile BLOCK_N=256</text>
<line x1="910" y1="478" x2="910" y2="504" class="e"/>
<rect x="690" y="504" width="440" height="74" class="b hw"/><text x="700" y="525" class="t">tensor core：SS形态 WGMMA（双操作数从共享内存）</text><text x="700" y="543" class="s">s1沿K恒定、token缩放沿K恒定 →</text><text x="700" y="560" class="s">整条K几十条指令一链到底，主循环内零次补缩放</text>
<line x1="910" y1="578" x2="910" y2="604" class="e"/>
<rect x="690" y="604" width="440" height="58" class="b flt"/><text x="700" y="625" class="t">promote 只做一次（K循环结束后）</text><text x="700" y="643" class="s">×token缩放×s1×整数转浮点</text>
<line x1="910" y1="662" x2="910" y2="796" class="e"/>
<rect x="690" y="676" width="440" height="106" class="b" style="fill:#f0fdf4;stroke:#16a34a"/><text x="700" y="698" class="t" font-weight="700">v3 低延迟档（A路径内，自动门控：pro M1-8 / flash M2-8）</text><text x="700" y="717" class="s">小token时流水线是延迟受限（4位读量仅FP8一半却只打平→带宽没用满）</text><text x="700" y="734" class="s">流水线8段→4段瘦身 + 寄存器按角色配给 → 两个CTA共驻一个SM</text><text x="700" y="751" class="s">两条独立流水线互相填掉对方等搬运/等唤醒的空转（SM级预取总量不变）</text><text x="700" y="768" class="s">实测 pro M8 −12% / flash M8 −15%；token≥16 自动回单CTA深流水</text>

<!-- 汇合：L1 epilogue -->
<rect x="60" y="796" width="1070" height="96" class="b pl"/>
<text x="75" y="818" class="h">第一层出口（epilogue，两路共用逻辑）</text>
<rect x="75" y="830" width="330" height="52" class="b flt"/><text x="85" y="850" class="t">×专家全局缩放 → gate/up截断 →</text><text x="85" y="868" class="t">SwiGLU: silu(gate)×up → ×路由权重</text>
<line x1="405" y1="856" x2="440" y2="856" class="e"/>
<rect x="440" y="830" width="330" height="52" class="b int"/><text x="450" y="850" class="t">每(token,64通道)求amax÷127 → 中间缩放</text><text x="450" y="868" class="s">64=CTA权重tile宽128÷2（几何决定）；量化时避开fp8的NaN字节</text>
<line x1="770" y1="856" x2="805" y2="856" class="e"/>
<rect x="805" y="830" width="310" height="52" class="b mem"/><text x="815" y="850" class="t">8位整数tile → 中间激活池</text><text x="815" y="868" class="t">缩放 → 缩放池（供第二层读）</text>

<line x1="590" y1="892" x2="590" y2="918" class="e"/>

<!-- L2 -->
<rect x="60" y="918" width="1070" height="108" class="b pl"/>
<text x="75" y="940" class="h">第二层（down投影）：GEMM流程同上，两处不同</text>
<rect x="75" y="952" width="500" height="62" class="b int"/><text x="85" y="973" class="t">输入缩放是 per-(token, 64个K)——沿K每64换一次尺子</text><text x="85" y="991" class="s">→ 累加器按64一段分两本账（不同尺子的裸乘积不能混账）</text><text x="85" y="1007" class="s">每半段各补一次中间缩放；s1照旧攒到最后</text>
<line x1="575" y1="983" x2="610" y2="983" class="e"/>
<rect x="610" y="952" width="505" height="62" class="b flt"/><text x="620" y="973" class="t">最终累加器 → bf16 → NVLink直接散射写回源卡合并缓冲</text><text x="620" y="991" class="s">各卡把topk份专家贡献求和 → 输出 y</text><text x="620" y="1007" class="s">（swapAB段两本账时前半的promote与后半在飞的矩阵乘天然重叠）</text>

<line x1="590" y1="1026" x2="590" y2="1052" class="e"/>

<!-- 总账 -->
<rect x="60" y="1052" width="1070" height="210" class="b pl"/>
<text x="75" y="1076" class="h">总账：每个缩放量在哪一步被乘回来</text>
<rect x="75" y="1092" width="510" height="72" class="b int"/><text x="85" y="1113" class="t">进解码（整数域，无损）：组缩放s2、零点z</text><text x="85" y="1131" class="s">小M折进查找表 / 大M折进前置kernel的乘法</text><text x="85" y="1148" class="s">整数能无损吸收整数缩放——QoQ方案的核心许可证</text>
<rect x="605" y="1092" width="510" height="72" class="b flt"/><text x="615" y="1113" class="t">走promote（浮点，累加后）：行缩放s1、token缩放、中间缩放</text><text x="615" y="1131" class="s">任意浮点进不了整数值域；token缩放是量化定义本身，任何方案都只能事后乘</text><text x="615" y="1148" class="s">沿K恒定的（s1/token）可无限推迟；沿K变的（中间per-64）到段就得结账</text>
<rect x="75" y="1176" width="1040" height="70" class="b" style="fill:#fef2f2;stroke:#dc2626"/>
<text x="90" y="1200" class="t" font-weight="700">核心不变式：WGMMA 前后是一条"整数国境线"</text>
<text x="90" y="1220" class="s">解码前搞定所有整数缩放（s2、z）→ 中间的矩阵乘累加是纯整数、bit精确、零舍入 → 累加后才允许浮点（s1、token缩放、SwiGLU）</text>
<text x="90" y="1238" class="s">硬件并行：tensor core转矩阵乘的几百拍里，CUDA core解下一批的码、TMA搬后面几段的数据——三种单元流水咬合</text>

<text x="60" y="1300" class="s">分段依据：swapAB段权重每64个token重复解码一遍（开销∝token数），预解码段每层一次全场共享（固定0.5ms）→ 交叉点≈1024</text>
<text x="60" y="1320" class="s">指令事实：SM90的WGMMA形状 m64 × n(8..256可选) × k(8位输入固定32)；"扩大K"发生在累加器链长层面而非指令层面</text>
<text x="60" y="1340" class="s">对应实现：sm90_mxfp4_mega_moe.cuh（DG_W4A8_INT/_L2/_QOQ/_QOQ_ZP/_QOQ_ZP_PRELUT/_SMALLM_OCC2/_PRE，前六项全开=v3最快配置）；设计与性能表见 W4A8_INT.md　2026-07-14（v3）</text>
</svg>
</body></html>
